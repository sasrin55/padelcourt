<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelLahore - Book & Play</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #00D9B5;
      --primary-dark: #00B598;
      --primary-light: #E0FFF9;
      --secondary: #1A1F36;
      --accent: #FFB946;
      --accent-pink: #FF6B9D;
      --bg-main: #F8FAFB;
      --bg-card: #FFFFFF;
      --text-dark: #1A1F36;
      --text-light: #6B7280;
      --text-muted: #9CA3AF;
      --success: #10B981;
      --error: #EF4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
      --shadow-xl: 0 25px 50px -12px rgba(0,0,0,0.25);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    
    .profile-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
      position: relative;
    }
    
    .profile-btn:hover {
      transform: scale(1.08) rotate(5deg);
      box-shadow: var(--shadow-lg);
    }
    
    .profile-btn.logged-in::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: var(--success);
      border-radius: 50%;
      border: 3px solid white;
      animation: pulse-ring 2s infinite;
    }
    
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }
    
    /* Main Content */
    .main {
      padding: 40px 0;
    }
    
    /* Date Swiper */
    .date-swiper {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    
    .date-nav-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    
    .date-nav-btn:hover:not(:disabled) {
      transform: scale(1.1);
      box-shadow: var(--shadow-lg);
    }
    
    .date-nav-btn:disabled {
      background: linear-gradient(135deg, #E5E7EB 0%, #D1D5DB 100%);
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .date-display {
      text-align: center;
      min-width: 320px;
    }
    
    .date-main {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .date-sub {
      font-size: 18px;
      color: var(--text-light);
      font-weight: 600;
    }
    
    .date-today-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-left: 12px;
      box-shadow: var(--shadow);
      animation: pulse-badge 2s infinite;
    }
    
    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* Controls */
    .controls {
      margin-bottom: 32px;
    }
    
    .controls-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .filter-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    
    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--primary);
    }
    
    .filter-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      border-color: transparent;
      box-shadow: var(--shadow);
    }
    
    .area-select {
      padding: 12px 20px;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      min-width: 160px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-dark);
    }
    
    .area-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 217, 181, 0.1);
    }
    
    /* Courts Grid */
    .courts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
      animation: fadeInUp 0.6s ease;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .court-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid rgba(255,255,255,0.5);
    }
    
    .court-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-xl);
    }
    
    .court-header {
      background: linear-gradient(135deg, var(--secondary) 0%, #2d3748 100%);
      color: white;
      padding: 20px 24px;
      position: relative;
    }
    
    .court-title {
      font-size: 20px;
      font-weight: 700;
      margin-right: 80px;
    }
    
    .court-type {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .court-type.indoor {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .court-type.outdoor {
      background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
    }
    
    .court-body {
      padding: 24px;
    }
    
    .court-info {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .info-item {
      display: flex;
      align-items: center;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 500;
    }
    
    .info-item i {
      margin-right: 8px;
      color: var(--primary);
      font-size: 16px;
    }
    
    .court-price {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
    }
    
    .court-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #E5E7EB, transparent);
      margin: 20px 0;
    }
    
    .slots-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .slots-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }
    
    .time-slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    
    .time-slot {
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      background: var(--primary-light);
      border: 2px solid transparent;
      color: var(--primary-dark);
    }
    
    .time-slot:hover:not(.booked) {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    
    .time-slot.booked {
      background: #FEE2E2;
      color: var(--error);
      cursor: not-allowed;
      text-decoration: line-through;
      opacity: 0.6;
    }
    
    .time-slot.selected {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      border-color: var(--primary-dark);
      box-shadow: var(--shadow);
    }
    
    /* Panels */
    .panel {
      position: fixed;
      top: 0;
      right: -500px;
      width: 500px;
      height: 100%;
      background: var(--bg-card);
      box-shadow: var(--shadow-xl);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    
    .panel.open {
      right: 0;
    }
    
    .panel-header {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      padding: 32px 32px 40px;
      position: relative;
    }
    
    .panel-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .panel-close:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }
    
    .panel-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .panel-subtitle {
      opacity: 0.9;
      font-size: 15px;
    }
    
    .panel-content {
      padding: 32px;
    }
    
    /* Profile View */
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
      border: 4px solid rgba(255, 255, 255, 0.3);
    }
    
    .profile-name {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .profile-phone {
      text-align: center;
      opacity: 0.9;
      font-size: 15px;
    }
    
    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      border-radius: var(--radius-sm);
      color: white;
      box-shadow: var(--shadow);
    }
    
    .stat-card:nth-child(2) {
      background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
    }
    
    .stat-card:nth-child(3) {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-pink) 100%);
    }
    
    .stat-card:nth-child(4) {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    
    .stat-label {
      font-size: 13px;
      opacity: 0.9;
      font-weight: 600;
    }
    
    /* Booking Item */
    .booking-item {
      background: var(--bg-main);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
      transition: var(--transition);
    }
    
    .booking-item:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow);
    }
    
    .booking-item-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 16px;
    }
    
    .booking-court-name {
      font-weight: 700;
      color: var(--text-dark);
      font-size: 18px;
    }
    
    .booking-ref {
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
      background: var(--primary-light);
      padding: 4px 12px;
      border-radius: 6px;
    }
    
    .booking-players {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    
    .player-badge {
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    
    .player-badge i {
      color: var(--primary);
    }
    
    .invite-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .invite-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    
    /* Form Styles */
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 14px;
    }
    
    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-size: 15px;
      transition: var(--transition);
      background: white;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 217, 181, 0.1);
    }
    
    .phone-input-group {
      position: relative;
    }
    
    .phone-prefix {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dark);
      font-weight: 700;
    }
    
    .phone-input {
      padding-left: 56px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-block {
      width: 100%;
    }
    
    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    
    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }
    
    /* Invite Modal */
    .invite-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: white;
      border-radius: var(--radius);
      padding: 0;
      box-shadow: var(--shadow-xl);
      z-index: 150;
      width: 90%;
      max-width: 500px;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }
    
    .invite-modal.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    
    .invite-modal-header {
      background: linear-gradient(135deg, var(--primary) 0%, #667eea 100%);
      color: white;
      padding: 24px;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    
    .invite-modal-body {
      padding: 24px;
    }
    
    .invite-link-box {
      background: var(--bg-main);
      padding: 16px;
      border-radius: 12px;
      margin: 16px 0;
      border: 2px dashed var(--primary);
    }
    
    .invite-link {
      font-family: monospace;
      font-size: 13px;
      color: var(--primary);
      word-break: break-all;
      font-weight: 600;
    }
    
    .copy-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: var(--transition);
    }
    
    .copy-btn:hover {
      background: var(--primary-dark);
    }
    
    .copy-btn.copied {
      background: var(--success);
    }
    
    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }
    
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 200;
      animation: slideInRight 0.3s ease;
      max-width: 400px;
    }
    
    @keyframes slideInRight {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    .toast.show {
      display: flex;
    }
    
    .toast.success {
      border-left: 4px solid var(--success);
    }
    
    .toast.error {
      border-left: 4px solid var(--error);
    }
    
    .toast i {
      font-size: 20px;
    }
    
    .toast.success i {
      color: var(--success);
    }
    
    .toast.error i {
      color: var(--error);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .logo {
        font-size: 24px;
      }
      
      .date-swiper {
        padding: 24px 16px;
        gap: 16px;
      }
      
      .date-nav-btn {
        width: 48px;
        height: 48px;
      }
      
      .date-display {
        min-width: auto;
      }
      
      .date-main {
        font-size: 24px;
      }
      
      .date-sub {
        font-size: 16px;
      }
      
      .courts-grid {
        grid-template-columns: 1fr;
      }
      
      .panel {
        width: 100%;
        right: -100%;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <div class="logo">🎾 PadelLahore</div>
        <button class="profile-btn" id="profile-btn">
          <i class="fas fa-user"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="container">
      <!-- Date Swiper -->
      <section class="date-swiper">
        <button class="date-nav-btn" id="prev-date">
          <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="date-display">
          <div class="date-main" id="date-main"></div>
          <div class="date-sub" id="date-sub"></div>
        </div>
        
        <button class="date-nav-btn" id="next-date">
          <i class="fas fa-chevron-right"></i>
        </button>
      </section>

      <!-- Controls -->
      <section class="controls">
        <div class="controls-inner">
          <div class="filter-group">
            <button class="filter-btn active" data-filter="all">All Courts</button>
            <button class="filter-btn" data-filter="indoor">Indoor</button>
            <button class="filter-btn" data-filter="outdoor">Outdoor</button>
          </div>
          
          <select class="area-select" id="area-filter">
            <option value="all">All Areas</option>
            <option value="dha">DHA</option>
            <option value="gulberg">Gulberg</option>
            <option value="johar">Johar Town</option>
            <option value="model">Model Town</option>
            <option value="askari">Askari</option>
            <option value="valencia">Valencia</option>
          </select>
        </div>
      </section>

      <!-- Courts Grid -->
      <section class="courts-grid" id="courts-container"></section>
    </div>
  </main>

  <!-- Booking Panel -->
  <div class="panel" id="booking-panel">
    <div class="panel-header">
      <button class="panel-close" id="close-booking">&times;</button>
      <h2 class="panel-title">Complete Booking</h2>
      <p class="panel-subtitle">Fill in your details to confirm</p>
    </div>
    <div class="panel-content">
      <div id="booking-details"></div>
      
      <form id="booking-form">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="phone-input-group">
            <span class="phone-prefix">+92</span>
            <input type="tel" class="form-control phone-input" id="phone" placeholder="3001234567" maxlength="10" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        
        <button type="submit" class="btn btn-block">
          <i class="fas fa-check"></i> Confirm Booking
        </button>
      </form>
    </div>
  </div>

  <!-- Profile Panel -->
  <div class="panel" id="profile-panel">
    <!-- Login View -->
    <div id="login-view">
      <div class="panel-header">
        <button class="panel-close" id="close-profile-login">&times;</button>
        <h2 class="panel-title">Welcome Back!</h2>
        <p class="panel-subtitle">Enter your phone number to continue</p>
      </div>
      <div class="panel-content">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <div class="phone-input-group">
              <span class="phone-prefix">+92</span>
              <input type="tel" class="form-control phone-input" id="login-phone" placeholder="3001234567" maxlength="10" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" id="login-name" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Email (Optional)</label>
            <input type="email" class="form-control" id="login-email">
          </div>
          
          <button type="submit" class="btn btn-block">
            <i class="fas fa-sign-in-alt"></i> Continue
          </button>
        </form>
      </div>
    </div>

    <!-- Profile View -->
    <div id="profile-view" style="display: none;">
      <div class="panel-header">
        <button class="panel-close" id="close-profile">&times;</button>
        <div class="profile-avatar">
          <i class="fas fa-user"></i>
        </div>
        <h2 class="profile-name" id="profile-name"></h2>
        <p class="profile-phone" id="profile-phone"></p>
      </div>
      <div class="panel-content">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-matches">0</div>
            <div class="stat-label">Matches Played</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-hours">0</div>
            <div class="stat-label">Hours Booked</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-courts">0</div>
            <div class="stat-label">Courts Visited</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-players">0</div>
            <div class="stat-label">Players Met</div>
          </div>
        </div>

        <!-- Bookings -->
        <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">My Bookings</h3>
        <div id="bookings-list"></div>

        <button class="btn btn-secondary btn-block" id="logout-btn" style="margin-top: 24px;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Invite Modal -->
  <div class="invite-modal" id="invite-modal">
    <div class="invite-modal-header">
      <h3 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">
        <i class="fas fa-user-plus"></i> Invite Friends
      </h3>
      <p style="opacity: 0.9;">Share this link with your friends</p>
    </div>
    <div class="invite-modal-body">
      <p style="color: var(--text-light); margin-bottom: 12px;">Anyone with this link can join your game</p>
      
      <div class="invite-link-box">
        <div class="invite-link" id="invite-link"></div>
      </div>
      
      <button class="copy-btn" id="copy-link-btn">
        <i class="fas fa-copy"></i> Copy Link
      </button>
      
      <button class="btn btn-secondary btn-block" id="close-invite" style="margin-top: 16px;">
        Close
      </button>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toast-message"></span>
  </div>

  <script>
    // Court data
    const courts = [
      { id: 1, name: "Padel Café", location: "DHA Phase 5", area: "dha", courts: 2, type: "Outdoor", price: "Rs. 3,000/hr", website: "https://padelcafe.pk/" },
      { id: 2, name: "Padel Park Lahore", location: "Valencia Town", area: "valencia", courts: 2, type: "Outdoor", price: "Rs. 2,500/hr", website: "https://www.padelparkpk.com/" },
      { id: 3, name: "Club Padel", location: "Goldcrest Mall, Gulberg", area: "gulberg", courts: 3, type: "Indoor", price: "Rs. 3,200/hr", website: "https://clubpadel.pk/" },
      { id: 4, name: "The Courts", location: "Gulberg III", area: "gulberg", courts: 2, type: "Indoor", price: "Rs. 2,800/hr", website: "https://www.thecourts.pk/" },
      { id: 5, name: "Padel Zone", location: "DHA Phase 6", area: "dha", courts: 2, type: "Outdoor", price: "Rs. 2,700/hr", website: "https://jumpzonepk.com/padel-zone/" },
      { id: 6, name: "The Padel Club", location: "DHA Phase 8", area: "dha", courts: 2, type: "Outdoor", price: "Rs. 3,000/hr", website: "https://thepadelclub.pk/" },
      { id: 7, name: "Padel Pro by LST", location: "Burki Road", area: "burki", courts: 2, type: "Outdoor", price: "Rs. 2,500/hr", website: "https://padelpro.pk/" },
      { id: 8, name: "Padel Pro by LST", location: "Askari 11", area: "askari", courts: 2, type: "Outdoor", price: "Rs. 2,400/hr", website: "https://padelpro.pk/" },
      { id: 9, name: "Padel Pad", location: "Johar Town", area: "johar", courts: 2, type: "Outdoor", price: "Rs. 2,200/hr", website: "https://padelpadpk.com/" },
      { id: 10, name: "FR Padel DHA", location: "DHA Phase 4", area: "dha", courts: 2, type: "Indoor", price: "Rs. 2,900/hr", website: "https://futsalrange.com/" },
      { id: 11, name: "Sky Padel", location: "Model Town", area: "model", courts: 1, type: "Outdoor", price: "Rs. 2,600/hr", website: "https://www.instagram.com/skypadelpk/" }
    ];

    const timeSlots = ["08:00 - 09:00", "09:00 - 10:00", "10:00 - 11:00", "11:00 - 12:00", "12:00 - 13:00", "13:00 - 14:00", "14:00 - 15:00", "15:00 - 16:00", "16:00 - 17:00", "17:00 - 18:00", "18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"];

    // State
    let currentDate = new Date();
    currentDate.setHours(0, 0, 0, 0);
    let currentUser = null;
    let activeFilter = 'all';
    let activeArea = 'all';
    let selectedCourt = null;
    let selectedTime = null;

    const bookings = {};
    const users = {};
    const userBookings = {};

    // DOM
    const courtsContainer = document.getElementById('courts-container');
    const dateMain = document.getElementById('date-main');
    const dateSub = document.getElementById('date-sub');
    const prevBtn = document.getElementById('prev-date');
    const nextBtn = document.getElementById('next-date');
    const profileBtn = document.getElementById('profile-btn');
    const bookingPanel = document.getElementById('booking-panel');
    const profilePanel = document.getElementById('profile-panel');
    const overlay = document.getElementById('overlay');
    const inviteModal = document.getElementById('invite-modal');
    const toast = document.getElementById('toast');

    // Format date
    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function formatDateDisplay(date) {
      return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Update date display
    function updateDateDisplay() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const isToday = currentDate.getTime() === today.getTime();
      
      dateMain.innerHTML = currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + 
        (isToday ? ' <span class="date-today-badge">Today</span>' : '');
      dateSub.textContent = currentDate.toLocaleDateString('en-US', { weekday: 'long' });
      
      prevBtn.disabled = currentDate.getTime() === today.getTime();
    }

    // Display courts
    function displayCourts() {
      courtsContainer.innerHTML = '';
      
      let filtered = courts.filter(c => 
        (activeFilter === 'all' || c.type.toLowerCase() === activeFilter) &&
        (activeArea === 'all' || c.area === activeArea)
      );

      filtered.forEach(court => {
        const card = document.createElement('div');
        card.className = 'court-card';
        
        const slots = timeSlots.map(time => {
          const key = `${court.id}-${formatDate(currentDate)}-${time}`;
          const booked = bookings[key];
          return `<div class="time-slot ${booked ? 'booked' : ''}" data-court="${court.id}" data-time="${time}">${time}</div>`;
        }).join('');

        card.innerHTML = `
          <div class="court-header">
            <h3 class="court-title">${court.name}</h3>
            <span class="court-type ${court.type.toLowerCase()}">${court.type}</span>
          </div>
          <div class="court-body">
            <div class="court-info">
              <div class="info-item"><i class="fas fa-map-marker-alt"></i>${court.location}</div>
              <div class="info-item"><i class="fas fa-table-tennis"></i>${court.courts} court${court.courts > 1 ? 's' : ''}</div>
              <div class="info-item court-price"><i class="fas fa-tag"></i>${court.price}</div>
            </div>
            <div class="court-divider"></div>
            <div class="slots-header">
              <div class="slots-title">Available Times</div>
            </div>
            <div class="time-slots">${slots}</div>
          </div>
        `;
        
        courtsContainer.appendChild(card);
      });

      // Add click listeners
      document.querySelectorAll('.time-slot:not(.booked)').forEach(slot => {
        slot.addEventListener('click', () => {
          document.querySelectorAll('.time-slot.selected').forEach(s => s.classList.remove('selected'));
          slot.classList.add('selected');
          
          selectedCourt = courts.find(c => c.id === parseInt(slot.dataset.court));
          selectedTime = slot.dataset.time;
          openBookingPanel();
        });
      });
    }

    // Open booking panel
    function openBookingPanel() {
      document.getElementById('booking-details').innerHTML = `
        <div style="background: var(--primary-light); padding: 20px; border-radius: 12px; margin-bottom: 24px;">
          <div style="margin-bottom: 12px;"><strong>Court:</strong> ${selectedCourt.name}</div>
          <div style="margin-bottom: 12px;"><strong>Location:</strong> ${selectedCourt.location}</div>
          <div style="margin-bottom: 12px;"><strong>Date:</strong> ${formatDateDisplay(currentDate)}</div>
          <div style="margin-bottom: 12px;"><strong>Time:</strong> ${selectedTime}</div>
          <div><strong>Price:</strong> ${selectedCourt.price}</div>
        </div>
      `;
      
      if (currentUser) {
        document.getElementById('name').value = currentUser.name;
        document.getElementById('phone').value = currentUser.phone.substring(3);
        document.getElementById('email').value = currentUser.email || '';
      }
      
      bookingPanel.classList.add('open');
      overlay.classList.add('active');
    }

    // Booking form
    document.getElementById('booking-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      let phone = document.getElementById('phone').value;
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      
      if (!phone.startsWith('+92')) {
        phone = '+92' + phone.replace(/^0+/, '');
      }
      
      const bookingId = 'PB' + Math.random().toString(36).substr(2, 6).toUpperCase();
      const key = `${selectedCourt.id}-${formatDate(currentDate)}-${selectedTime}`;
      
      const booking = {
        id: bookingId,
        court: selectedCourt,
        date: formatDateDisplay(currentDate),
        dateValue: formatDate(currentDate),
        time: selectedTime,
        name,
        phone,
        email,
        players: [{ name, phone }],
        timestamp: new Date().toISOString()
      };
      
      bookings[key] = booking;
      
      if (!users[phone]) {
        users[phone] = { phone, name, email, createdAt: new Date().toISOString() };
      }
      
      if (!userBookings[phone]) {
        userBookings[phone] = [];
      }
      userBookings[phone].push(booking);
      
      if (!currentUser) {
        currentUser = users[phone];
        profileBtn.classList.add('logged-in');
      }
      
      showToast('Booking confirmed! 🎉', 'success');
      closePanel(bookingPanel);
      displayCourts();
    });

    // Profile
    profileBtn.addEventListener('click', () => {
      if (currentUser) {
        showProfile();
      } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('profile-view').style.display = 'none';
      }
      profilePanel.classList.add('open');
      overlay.classList.add('active');
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      let phone = document.getElementById('login-phone').value;
      const name = document.getElementById('login-name').value;
      const email = document.getElementById('login-email').value;
      
      phone = '+92' + phone.replace(/^0+/, '');
      
      if (!users[phone]) {
        users[phone] = { phone, name, email, createdAt: new Date().toISOString() };
      }
      
      currentUser = users[phone];
      profileBtn.classList.add('logged-in');
      showProfile();
      showToast('Welcome back! 👋', 'success');
    });

    function showProfile() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('profile-view').style.display = 'block';
      
      document.getElementById('profile-name').textContent = currentUser.name;
      document.getElementById('profile-phone').textContent = formatPhoneDisplay(currentUser.phone);
      
      const myBookings = userBookings[currentUser.phone] || [];
      const uniqueCourts = new Set(myBookings.map(b => b.court.id)).size;
      const allPlayers = new Set();
      myBookings.forEach(b => b.players.forEach(p => allPlayers.add(p.phone)));
      
      document.getElementById('stat-matches').textContent = myBookings.length;
      document.getElementById('stat-hours').textContent = myBookings.length;
      document.getElementById('stat-courts').textContent = uniqueCourts;
      document.getElementById('stat-players').textContent = allPlayers.size;
      
      const bookingsList = document.getElementById('bookings-list');
      if (myBookings.length === 0) {
        bookingsList.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">No bookings yet</p>';
      } else {
        bookingsList.innerHTML = myBookings.map(b => `
          <div class="booking-item">
            <div class="booking-item-header">
              <div class="booking-court-name">${b.court.name}</div>
              <div class="booking-ref">${b.id}</div>
            </div>
            <div style="color: var(--text-light); font-size: 14px; margin-bottom: 8px;">
              <div><i class="fas fa-calendar"></i> ${b.date}</div>
              <div><i class="fas fa-clock"></i> ${b.time}</div>
            </div>
            <div class="booking-players">
              ${b.players.map(p => `<div class="player-badge"><i class="fas fa-user"></i>${p.name}</div>`).join('')}
            </div>
            <button class="invite-btn" onclick="showInviteModal('${b.id}')">
              <i class="fas fa-user-plus"></i> Invite Friends
            </button>
          </div>
        `).join('');
      }
    }

    function formatPhoneDisplay(phone) {
      if (phone.startsWith('+92') && phone.length === 13) {
        return `+92 ${phone.substring(3, 6)} ${phone.substring(6)}`;
      }
      return phone;
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('Logout?')) {
        currentUser = null;
        profileBtn.classList.remove('logged-in');
        closePanel(profilePanel);
        showToast('Logged out', 'success');
      }
    });

    // Invite system
    window.showInviteModal = (bookingId) => {
      const link = `${window.location.origin}${window.location.pathname}?join=${bookingId}`;
      document.getElementById('invite-link').textContent = link;
      inviteModal.classList.add('show');
      overlay.classList.add('active');
    };

    document.getElementById('copy-link-btn').addEventListener('click', () => {
      const link = document.getElementById('invite-link').textContent;
      navigator.clipboard.writeText(link);
      document.getElementById('copy-link-btn').innerHTML = '<i class="fas fa-check"></i> Copied!';
      document.getElementById('copy-link-btn').classList.add('copied');
      setTimeout(() => {
        document.getElementById('copy-link-btn').innerHTML = '<i class="fas fa-copy"></i> Copy Link';
        document.getElementById('copy-link-btn').classList.remove('copied');
      }, 2000);
    });

    document.getElementById('close-invite').addEventListener('click', () => {
      inviteModal.classList.remove('show');
      if (!bookingPanel.classList.contains('open') && !profilePanel.classList.contains('open')) {
        overlay.classList.remove('active');
      }
    });

    // Close panels
    function closePanel(panel) {
      panel.classList.remove('open');
      if (!bookingPanel.classList.contains('open') && !profilePanel.classList.contains('open') && !inviteModal.classList.contains('show')) {
        overlay.classList.remove('active');
      }
    }

    document.getElementById('close-booking').addEventListener('click', () => closePanel(bookingPanel));
    document.getElementById('close-profile-login').addEventListener('click', () => closePanel(profilePanel));
    document.getElementById('close-profile').addEventListener('click', () => closePanel(profilePanel));
    
    overlay.addEventListener('click', () => {
      closePanel(bookingPanel);
      closePanel(profilePanel);
      inviteModal.classList.remove('show');
      overlay.classList.remove('active');
    });

    // Toast
    function showToast(message, type = 'success') {
      document.getElementById('toast-message').textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Date navigation
    prevBtn.addEventListener('click', () => {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (currentDate.getTime() > today.getTime()) {
        currentDate.setDate(currentDate.getDate() - 1);
        updateDateDisplay();
        displayCourts();
      }
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      updateDateDisplay();
      displayCourts();
    });

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        displayCourts();
      });
    });

    document.getElementById('area-filter').addEventListener('change', (e) => {
      activeArea = e.target.value;
      displayCourts();
    });

    // Phone input validation
    document.getElementById('phone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
    
    document.getElementById('login-phone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!bookingPanel.classList.contains('open') && !profilePanel.classList.contains('open')) {
        if (e.key === 'ArrowLeft' && !prevBtn.disabled) {
          prevBtn.click();
        } else if (e.key === 'ArrowRight') {
          nextBtn.click();
        }
      }
    });

    // Initialize
    updateDateDisplay();
    displayCourts();

    // Check for invite link
    const urlParams = new URLSearchParams(window.location.search);
    const joinBooking = urlParams.get('join');
    if (joinBooking) {
      showToast('Join booking feature - coming soon! 🎾', 'success');
    }
  </script>
</body>
</html>
